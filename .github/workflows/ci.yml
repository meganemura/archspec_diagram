name: CI

on:
  push:
    branches:
      - main
      - queue
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # rbs-inline and Steep need Ruby 3.4 or newer.
          ruby-version: "3.4"
          bundler-cache: true
      - name: Write the signatures from lib/
        run: bundle exec rbs-inline --output=sig/generated lib
      # intent-to-add makes a new file that nobody committed show in the diff too.
      - name: Check that the committed signatures are current
        run: git add --intent-to-add sig && git diff --exit-code sig
      - name: Check lib/ with Steep
        run: bundle exec steep check
      # A file Steep cannot type check at all gets no diagnostic, so `steep
      # check` passes (soutaro/steep#2356). `steep stats` marks that file
      # as error.
      - name: Check that Steep type checked every file
        run: >-
          bundle exec steep stats --format=csv |
          awk -F, 'NR > 1 && $3 == "error" { print "Steep did not type check " $2; failed = 1 } END { exit failed }'
        shell: bash
